<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <title>Создать рецепт</title>
  <script src="js/theme.js"></script>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <!-- ЗАСТАВКА ПРИ ЗАГРУЗКЕ -->
  <div id="introScreen">
    <div class="intro-scene">
      
      <div class="intro-text-wrapper">
        <svg class="intro-svg" viewBox="0 0 500 150">
          <text x="50%" y="50%" dominant-baseline="middle" text-anchor="middle">Foodgram</text>
        </svg>
        
        <!-- Группа: Огонь + Сковородка (летают вместе) -->
        <div class="pan-group">
          <div class="intro-fire">♨️</div>
          <div class="intro-pan">
            <div class="pan-egg">🍳</div>
          </div>
        </div>
      </div>

    </div>
  </div>
  <!-- КОНЕЦ ЗАСТАВКИ -->
  <header class="header">
    <div class="logo">
      <div class="pan-container">
        <span class="fire">♨️</span>
        <span class="egg">🍳</span>
      </div>
      <span class="logo-text">
        <span>F</span><span>o</span><span>o</span><span>d</span><span>g</span><span>r</span><span>a</span><span>m</span>
      </span>
    </div>
    <nav class="nav">
      <div class="search-wrap">
        <button id="searchToggle" class="icon-btn" title="Поиск">🔍</button>
        <input type="search" id="searchInput" class="search-input"
               placeholder="Найти рецепт..." autocomplete="off">
        <div id="searchSuggestions" class="search-suggestions"></div>
      </div>

      <a href="index.html">Главная</a>

      <div id="userMenu" class="user-menu" style="display:none">
        <button id="userMenuBtn" class="user-menu-btn">
          <span id="userName">user</span>
          <span class="arrow">▼</span>
        </button>
        <div id="userDropdown" class="user-dropdown">
          <a href="profile.html">👤 Мой профиль</a>
          <a href="acaunt.html">📖 Мои рецепты</a>
          <a href="create.html">+ Создать рецепт</a>
          <a href="liked.html">♥ Понравившиеся рецепты</a>
          <a href="saved.html">★ Избранные рецепты</a>
          <a href="#" id="logoutBtn" class="logout-link">⎋ Выход</a>
        </div>
      </div>

      <span id="authBlock">
        <a href="login.html">Вход</a>
        <a href="register.html">Регистрация</a>
      </span>

      <button id="themeToggle" class="theme-toggle" title="Переключить тему">🌙</button>
    </nav>
  </header>

  <main class="container">
    <h1 class="title">Новый рецепт</h1>

    <form id="recipeForm" class="auth-form">
      <input type="text" name="title" placeholder="Название рецепта" required>

      <select name="category" required>
        <option value="">— Выберите категорию —</option>
        <option value="desserts">Десерты</option>
        <option value="drinks">Напитки</option>
        <option value="hot">Горячие блюда</option>
        <option value="soups">Супы</option>
        <option value="salads">Салаты</option>
        <option value="bakery">Выпечка</option>
        <option value="snacks">Закуски</option>
        <option value="breakfast">Завтраки</option>
      </select>

      <textarea name="description" placeholder="Краткое описание" rows="2"></textarea>

      <div class="ingredients-box">
        <label>Ингредиенты:</label>
        <select id="ingredientSelect">
          <option value="">— Выберите ингредиент —</option>
        </select>
        <input type="text" id="ingredientAmount" placeholder="Кол-во (например, 200 г)">
        <button type="button" id="addIngredient" class="cat-btn">Добавить</button>
        <ul id="ingredientsList"></ul>
        <input type="hidden" name="ingredients" id="ingredientsHidden">
      </div>

      <textarea name="steps" placeholder="Шаги приготовления" rows="5" required></textarea>
      
      <!-- Блок загрузки фото -->
      <label class="custom-file-upload">
        <input type="file" id="imageFile" accept="image/*" onchange="updateFileName(this)">
        <div class="file-upload-text">
          <span>📷</span>
          Выберите фото блюда
        </div>
        <div class="file-name" id="fileNameDisplay">Файл не выбран</div>
      </label>

      <button type="submit" class="cat-btn">Опубликовать</button>
      <p id="msg"></p>
    </form>
  </main>

  <script src="js/auth.js"></script>
  <script src="js/create.js"></script>
  
  <!-- Скрипт для показа имени выбранного файла -->
  <script>
    function updateFileName(input) {
      const display = document.getElementById('fileNameDisplay');
      if (input.files && input.files.length > 0) {
        display.textContent = input.files[0].name;
        display.style.color = 'var(--accent)';
        display.style.fontWeight = 'bold';
      } else {
        display.textContent = 'Файл не выбран';
        display.style.color = 'var(--text-muted)';
        display.style.fontWeight = 'normal';
      }
    }
  </script>
</body>
</html>
